services:
  app:
    image: ghcr.io/dobro10k2/devops-engineer-from-scratch-project-74:latest
    build:
      context: .
      dockerfile: Dockerfile.production
    command: make test
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:latest
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
